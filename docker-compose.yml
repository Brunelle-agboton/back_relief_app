services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # L'étape `development` conserve les devDependencies et le rechargement
      # à chaud ; l'étape `production` (défaut de l'image) en est distincte.
      target: development
    ports:
      - "3000:3000"
    command: npm run start:dev
    volumes:
      - ./backend/:/api
      # Volume anonyme : évite que le montage précédent masque les dépendances
      # installées dans l'image.
      - /api/node_modules
      - ./front-client/assets/images:/front-client/assets/images:ro
    # Toute la configuration vient de backend/.env — y compris POSTGRES_HOST,
    # qui doit valoir `db` (le nom du service) et non `localhost` sous compose.
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
        restart: true
  db:
    # Version épinglée : une image `postgres` flottante finit par changer de
    # version majeure et rend le répertoire de données illisible.
    image: postgres:17
    restart: always
    env_file:
      # Fournit POSTGRES_USER, POSTGRES_PASSWORD et POSTGRES_DB.
      #
      # Attention : l'image postgres ne connaît QUE `POSTGRES_DB`. Le backend,
      # lui, lit `POSTGRES_DATABASE`. Les deux variables doivent exister et
      # porter la même valeur, sinon l'image crée une base nommée d'après
      # POSTGRES_USER et le backend cherche une base inexistante.
      - ./backend/.env
    environment:
      # Chemin ABSOLU, à l'intérieur du volume monté ci-dessous. Un chemin
      # relatif est résolu dans le conteneur : les données ne survivent alors
      # pas à sa suppression.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - ./dbData:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` renvoie 0 dès que le serveur répond, même si la base
      # demandée n'existe pas : le backend démarrait alors pour boucler sur
      # « database does not exist ». Une vraie requête vérifie la base.
      test:
        ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
  adminer:
    image: adminer
    restart: always
    ports:
      - 8070:8080
  frontend:
      build:
        context: ./front-client
        dockerfile: Dockerfile
      ports:
        - "8081:8081"     # Metro bundler (React Native dev)
        - "19000:19000"   # Expo
        - "19001:19001"   # Expo
        - "19002:19002"   # Expo Web
      volumes:
        - ./front-client:/app
      stdin_open: true
      tty: true
  #    depends_on:
  #      - api